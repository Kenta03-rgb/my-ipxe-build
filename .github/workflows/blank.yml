name: BootNetTr - Ultimate iPXE Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Bağımlılıkları Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y liblzma-dev mtools gcc binutils make perl libssl-dev git

      - name: iPXE Kaynak Kodunu Çek
        run: git clone https://github.com/ipxe/ipxe.git ipxe-source

      - name: Maksimum Özellikleri Aktif Et (SAN Boot & İmaj Formatları)
        run: |
          cd ipxe-source/src/config
          
          # Ağ ve Depolama Protokolleri
          sed -i 's|//#define DOWNLOAD_PROTO_HTTP|#define DOWNLOAD_PROTO_HTTP|' general.h
          sed -i 's|//#define DOWNLOAD_PROTO_HTTPS|#define DOWNLOAD_PROTO_HTTPS|' general.h
          sed -i 's|//#define DOWNLOAD_PROTO_FTP|#define DOWNLOAD_PROTO_FTP|' general.h
          sed -i 's|//#define DOWNLOAD_PROTO_NFS|#define DOWNLOAD_PROTO_NFS|' general.h
          sed -i 's|//#define SANBOOT_PROTO_ISCSI|#define SANBOOT_PROTO_ISCSI|' general.h
          sed -i 's|//#define SANBOOT_PROTO_AOE|#define SANBOOT_PROTO_AOE|' general.h
          sed -i 's|//#define SANBOOT_PROTO_IBFT|#define SANBOOT_PROTO_IBFT|' general.h
          
          # İmaj (Image) Yükleme Destekleri
          sed -i 's|//#define IMAGE_COMBOOT|#define IMAGE_COMBOOT|' general.h
          sed -i 's|//#define IMAGE_BZIMAGE|#define IMAGE_BZIMAGE|' general.h
          sed -i 's|//#define IMAGE_MULTIBOOT|#define IMAGE_MULTIBOOT|' general.h
          sed -i 's|//#define IMAGE_ELF|#define IMAGE_ELF|' general.h
          sed -i 's|//#define IMAGE_PXE|#define IMAGE_PXE|' general.h
          sed -i 's|//#define IMAGE_SCRIPT|#define IMAGE_SCRIPT|' general.h
          sed -i 's|//#define IMAGE_ZLIB|#define IMAGE_ZLIB|' general.h
          sed -i 's|//#define IMAGE_GZIP|#define IMAGE_GZIP|' general.h
          
          # Komutlar ve Konsol Görünümü
          sed -i 's|//#define CONSOLE_FRAMEBUFFER|#define CONSOLE_FRAMEBUFFER|' console.h
          sed -i 's|//#define CONSOLE_CMDLINE|#define CONSOLE_CMDLINE|' console.h
          sed -i 's|//#define PING_CMD|#define PING_CMD|' general.h
          sed -i 's|//#define NSLOOKUP_CMD|#define NSLOOKUP_CMD|' general.h

      - name: BootNetTr Özel Gömülü Scriptini (embed.ipxe) Oluştur
        run: |
          cd ipxe-source/src
          # iPXE'nin kalbine gömülecek olan script
          cat > embed.ipxe << 'EOF'
          #!ipxe
          
          echo ===================================================
          echo      BootNetTr iPXE Engine Yukleniyor...
          echo ===================================================
          echo MAC Adresi: ${net0/mac}
          echo IP ve Ayarlar DHCP'den (BootNetTr) Isteniyor...
          
          :retry_dhcp
          dhcp || goto retry_dhcp
          
          echo ===================================================
          echo [BASARILI] IP Alindi: ${ip}
          echo [BILGI] Yonlendirici Sunucu (Next-Server): ${next-server}
          echo ===================================================
          echo Ana konfigurasyon (boot.ipxe) HTTP uzerinden cekiliyor...
          
          # BootNetTr HTTP sunucusuna bağlanır
          chain http://${next-server}/boot.ipxe || goto hata
          
          :hata
          echo 
          echo [KRITIK HATA] BootNetTr HTTP Sunucusuna baglanilamadi!
          echo Lutfen BootNetTr exe'sinin acik oldugundan emin ol.
          echo 10 saniye icinde shell'e dusuluyor...
          sleep 10
          shell
          EOF

      - name: BIOS (Legacy) İçin Derle (undionly.kpxe)
        working-directory: ./ipxe-source/src
        run: make bin/undionly.kpxe EMBED=embed.ipxe || exit 1

      - name: UEFI (x64) İçin Derle (ipxe.efi)
        working-directory: ./ipxe-source/src
        run: make bin-x86_64-efi/ipxe.efi EMBED=embed.ipxe || exit 1

      - name: Derlenen Dosyaları Çıktı Al (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: BootNetTr-iPXE-Bomba-Paket
          path: |
            ipxe-source/src/bin/undionly.kpxe
            ipxe-source/src/bin-x86_64-efi/ipxe.efi
          if-no-files-found: error
